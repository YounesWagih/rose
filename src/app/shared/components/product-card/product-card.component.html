<article class="product-card">
  <div
    class="product-card__image"
    [class.product-card__image--actions-visible]="actionsVisible()"
  >
    <img [src]="product.imgCover" [alt]="product.title" />
    <button
      class="product-card__image-toggle"
      type="button"
      [attr.aria-expanded]="actionsVisible()"
      [attr.aria-label]="'Show actions for ' + product.title"
      (click)="toggleProductActions()"
    ></button>

    @if (product.quantity !== undefined && product.quantity <= 0) {
      <span class="product-card__stock">Out of stock</span>
    }

    @if (showNavigation) {
      <button
        class="product-card__carousel-arrow product-card__carousel-arrow--previous"
        type="button"
        [attr.aria-label]="'Previous product from ' + product.title"
        (click)="$event.stopPropagation(); previous.emit()"
      >
        <img src="assets/icons/chevron-left.svg" alt="" />
      </button>
      <button
        class="product-card__carousel-arrow product-card__carousel-arrow--next"
        type="button"
        [attr.aria-label]="'Next product from ' + product.title"
        (click)="$event.stopPropagation(); next.emit()"
      >
        <img src="assets/icons/chevron-right.svg" alt="" />
      </button>
    }

    <div class="product-card__actions" (click)="toggleProductActions()">
      <button
        type="button"
        title="Product details"
        [routerLink]="['/product', product._id]"
        (click)="$event.stopPropagation()"
      >
        <img src="assets/icons/product-eye.svg" alt="" />
      </button>
      <button
        type="button"
        [title]="wishlist.isInWishlist(product._id) ? 'Remove from wishlist' : 'Add to wishlist'"
        [disabled]="wishlist.isUpdating()"
        (click)="$event.stopPropagation(); toggleWishlist()"
      >
        @if (wishlist.isInWishlist(product._id)) {
          <img src="assets/icons/product-remove.svg" alt="" />
        } @else {
          <img src="assets/icons/product-heart.svg" alt="" />
        }
      </button>
    </div>
  </div>

  <div class="product-card__info">
    <h3>{{ product.title }}</h3>

    <div class="product-card__bottom">
      <div>
        <div class="product-card__rating">
          @for (star of stars; track star) {
            <span [class.product-card__star--empty]="star > product.rateAvg">★</span>
          }
        </div>

        <p class="product-card__price">
          <span>{{ currentPrice(product) | currency }}</span>
          @if (hasDiscount(product)) {
            <del>{{ product.price | currency }}</del>
          }
        </p>
      </div>

      <button
        class="product-card__bag"
        type="button"
        title="Add to shopping bag"
        [disabled]="cart.isUpdating() || (product.quantity !== undefined && product.quantity <= 0)"
        (click)="addToCart()"
      >
        <img src="assets/icons/product-bag.svg" alt="" />
      </button>
    </div>
  </div>
</article>
