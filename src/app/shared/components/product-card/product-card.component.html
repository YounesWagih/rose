<article class="product-card">
  <div class="product-card__image">
    <img [src]="product.imgCover" [alt]="product.title" />

    @if (product.quantity !== undefined && product.quantity <= 0) {
      <span class="product-card__stock">Out of stock</span>
    }

    <div class="product-card__actions">
      <button
        type="button"
        title="Product details"
        [routerLink]="['/product', product._id]"
      >
        <img src="assets/icons/product-eye.svg" alt="" />
      </button>
      <button
        type="button"
        [title]="wishlist.isInWishlist(product._id) ? 'Remove from wishlist' : 'Add to wishlist'"
        [disabled]="wishlist.isUpdating()"
        (click)="toggleWishlist()"
      >
        @if (wishlist.isInWishlist(product._id)) {
          <img src="assets/icons/product-remove.svg" alt="" />
        } @else {
          <img src="assets/icons/product-heart.svg" alt="" />
        }
      </button>
    </div>
  </div>

  <div class="product-card__info">
    <h3>{{ product.title }}</h3>

    <div class="product-card__bottom">
      <div>
        <div class="product-card__rating">
          @for (star of stars; track star) {
            <span [class.product-card__star--empty]="star > product.rateAvg">★</span>
          }
        </div>

        <p class="product-card__price">
          <span>{{ currentPrice(product) | currency }}</span>
          @if (hasDiscount(product)) {
            <del>{{ product.price | currency }}</del>
          }
        </p>
      </div>

      <button
        class="product-card__bag"
        type="button"
        title="Add to shopping bag"
        [disabled]="product.quantity !== undefined && product.quantity <= 0"
      >
        <img src="assets/icons/product-bag.svg" alt="" />
      </button>
    </div>
  </div>
</article>
